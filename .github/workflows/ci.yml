name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'schedule'
    # The integration suite starts Postgres, Redis and RustFS through
    # Testcontainers against the runner's own Docker daemon, so this job needs
    # no `services:` block and never runs `pnpm db:up` — the containers are the
    # suite's, created and destroyed per run. A wedged container would
    # otherwise hold a runner for six hours; the whole check is minutes.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      # Hoisted here rather than onto the step, for two independent reasons:
      # `secrets` is not an available context in a step's `if:` at all, and a
      # step's own `env:` is not in scope for that same step's `if:`. A job
      # `env` is, so this is the only indirection that works.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Testcontainers pulls postgres:16, redis:7.2-alpine, rustfs and ryuk on
      # every run. Anonymous Docker Hub pulls are rate-limited per IP, and a
      # hosted runner's IP is shared with every other job on it, so the limit
      # can be spent before this job starts and `timeout-minutes` would not
      # catch it — a TOOMANYREQUESTS is a fast failure, not a hang.
      # Authenticated pulls count against the account instead.
      #
      # Skipped when the secret is absent: this repository is public, and a
      # pull request from a fork cannot read repository secrets. Falling back
      # to an anonymous pull is worse than authenticating and better than
      # failing the job on an empty username.
      #
      # Both are checked, not just the username: a set-but-empty or expired
      # token would otherwise fail this step and take the whole job red — a
      # worse outcome than the anonymous pull the guard exists to preserve,
      # and one that reads as a broken branch rather than a missing secret.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: pnpm check:affected
        env:
          # turbo resolves --affected's base differently per event: on push it
          # reads github.event.before, but on pull_request it tries the bare
          # ref `main`, which actions/checkout never creates locally (it checks
          # out the merge ref in detached HEAD). Resolution fails regardless of
          # fetch-depth and turbo falls back to "assume everything changed".
          # Setting the base explicitly is what actually makes --affected work.
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          # `budget` depends on `build`, and the build must succeed against an
          # unreachable API here exactly as in the DoD 9 step below.
          API_INTERNAL_URL: http://127.0.0.1:9
      - name: Build with an unreachable API URL (DoD 9)
        run: pnpm turbo run build --affected --output-logs=errors-only --env-mode=strict
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          # A closed port on purpose: §10.1 makes "the build succeeds against
          # an unreachable API" the DoD 9 acceptance, so a build that quietly
          # fetches at compile time fails here instead of in production. It has
          # no effect until apps/web exists in Phase 3, and declaring it now
          # means the job does not change shape then.
          API_INTERNAL_URL: http://127.0.0.1:9

  e2e:
    if: github.event_name != 'schedule'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `next build` and `next start` read apps/web/.env from disk; the
      # example holds the local values and no secret.
      - run: cp apps/web/.env.example apps/web/.env
      # Chromium is cached on the Playwright pin. The catalog file is the only
      # place that pin lives, so its hash is the key; system libraries are not
      # cached and are installed on every run.
      - name: Cache Chromium
        id: chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-workspace.yaml') }}
      - if: steps.chromium.outputs.cache-hit != 'true'
        run: pnpm --filter web exec playwright install --with-deps chromium
      - if: steps.chromium.outputs.cache-hit == 'true'
        run: pnpm --filter web exec playwright install-deps chromium
      # The same two inputs as the DoD 9 build in `check`; `pnpm e2e` then
      # replays the build from turbo's cache and starts the server.
      - run: pnpm turbo run build --filter=web --output-logs=errors-only
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          API_INTERNAL_URL: http://127.0.0.1:9
      - run: pnpm e2e
        env:
          CI: 'true'
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          API_INTERNAL_URL: http://127.0.0.1:9
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  openapi:
    if: github.event_name != 'schedule'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # src/openapi.ts boots AppModule without listening and needs a
      # schema-valid environment, not a live store (§5.5, §10.1); the example
      # holds the local values and no secret.
      - run: cp apps/api/.env.example apps/api/.env
      - run: pnpm openapi:generate
      # A diff means a contract or a route changed without regenerating:
      # generated.md's rule, enforced. Both paths are prettier-ignored, so
      # formatting cannot manufacture a diff.
      - run: git diff --exit-code -- apps/api/openapi.json packages/api-client/src/generated

  authors:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: bash scripts/audit-authors.sh

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          # Required on pull_request events: the action reads the PR's commit
          # range through the API. Without it the job errors immediately
          # instead of scanning, which looks like a failure but scans nothing.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
