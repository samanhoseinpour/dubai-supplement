[extend]
useDefault = true

[[rules]]
id = "generic-assigned-secret"
description = "High-entropy value assigned to a *_TOKEN / *_SECRET / *_KEY name"
regex = '''(?i)\b[A-Z0-9_]*(TOKEN|SECRET|KEY)\s*[=:]\s*['"]?([A-Za-z0-9+/_\-]{24,})['"]?'''
entropy = 3.5
secretGroup = 2

[rules.allowlist]
paths = ['''\.env\.example$''']

[[rules]]
id = "connection-string-with-credentials"
description = "URI with embedded credentials (postgres://user:pass@host, redis://:pass@host)"
regex = '''[a-zA-Z][a-zA-Z0-9+.-]*://[^\s:/@]*:[^\s:/@]+@[^\s/"']+'''

[rules.allowlist]
description = "Canonical local development values are documented on purpose (spec Appendix B)"
regexes = [
  '''://[^\s:/@]*:[^\s:/@]+@(127\.0\.0\.1|localhost|postgres|redis|host)\b''',
]
paths = ['''\.env\.example$''', '''^docs/''']

[allowlist]
description = "Committed placeholder files never hold real values"
paths = ['''\.env\.example$''', '''pnpm-lock\.yaml$''']
