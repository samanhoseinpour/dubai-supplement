packages:
  - 'apps/*'
  - 'packages/*'

catalogMode: strict
minimumReleaseAge: 1440
blockExoticSubdeps: true
forceLegacyDeploy: true
injectWorkspacePackages: false

allowBuilds:
  esbuild: true
  '@swc/core': true
  sharp: true
  lefthook: true
  '@scarf/scarf': false
  # Build scripts that surfaced when testcontainers brought in dockerode.
  # None of the three is needed to talk to a local Docker socket, and each
  # would make the install depend on a toolchain every machine and CI runner
  # would then have to carry.
  cpu-features: false
  ssh2: false
  protobufjs: false

peerDependencyRules:
  allowedVersions:
    '@nest-lab/throttler-storage-redis>@nestjs/common': '12'
    '@nest-lab/throttler-storage-redis>@nestjs/core': '12'

